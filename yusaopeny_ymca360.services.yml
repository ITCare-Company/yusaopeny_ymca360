services:
  yusaopeny_ymca360.y360_client:
    class: Drupal\yusaopeny_ymca360\Y360Client
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.channel.yusaopeny_ymca360_syncer'

  yusaopeny_ymca360.mapping_repository:
    class: Drupal\yusaopeny_ymca360\Y360MappingRepository
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.channel.yusaopeny_ymca360_syncer'

  yusaopeny_ymca360.data_wrapper:
    class: Drupal\yusaopeny_ymca360\syncer\DataWrapper

  yusaopeny_ymca360.extractor:
    class: Drupal\yusaopeny_ymca360\syncer\ExtractorBase
    arguments:
      - '@config.factory'
      - '@yusaopeny_ymca360.y360_client'
      - '@yusaopeny_ymca360.data_wrapper'
      - '@logger.channel.yusaopeny_ymca360_syncer'

  yusaopeny_ymca360.loader:
    class: Drupal\yusaopeny_ymca360\syncer\LoaderBase
    arguments:
      - '@yusaopeny_ymca360.data_wrapper'
      - '@yusaopeny_ymca360.mapping_repository'
      - '@entity_type.manager'
      - '@logger.channel.yusaopeny_ymca360_syncer'
      - '@state'
      - '@config.factory'
      - '@module_handler'

  yusaopeny_ymca360.transformer:
    class: Drupal\yusaopeny_ymca360\syncer\TransformerBase
    arguments:
      - '@yusaopeny_ymca360.data_wrapper'
      - '@yusaopeny_ymca360.mapping_repository'
      - '@logger.channel.yusaopeny_ymca360_syncer'
      - '@entity.memory_cache'

  yusaopeny_ymca360.cleaner:
    class: Drupal\yusaopeny_ymca360\Y360Cleaner
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'

  logger.channel.yusaopeny_ymca360_syncer:
    parent: logger.channel_base
    arguments: ['yusaopeny_ymca360_syncer']
